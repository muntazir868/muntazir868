<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The QA loop for production voice agents</title><desc id="d">A closed loop: test calls before release, live calls, an LLM judge, human review of flagged calls, an automatically opened ticket, and a fix that goes back into the test calls.</desc>
<rect x="0.5" y="0.5" width="1199" height="469" rx="20" fill="#F5F6FA" stroke="#D3D7E6"/>
<text x="40" y="58" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="32" font-weight="700" fill="#14183A" text-anchor="start" >How quality is checked</text>
<text x="40" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5A6080" text-anchor="start" >Automated scoring on every call, with people only on the calls that need them.</text>
<path id="trk" d="M180,200 H1020 A80,80 0 0 1 1100,280 A80,80 0 0 1 1020,360 H180 A80,80 0 0 1 100,280 A80,80 0 0 1 180,200 Z" fill="none" stroke="#B4BBF6" stroke-width="10" stroke-linejoin="round"/>
<path d="M-6,-8 L5,0 L-6,8" transform="translate(410,200) rotate(0)" fill="none" stroke="#2F3FE0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M-6,-8 L5,0 L-6,8" transform="translate(790,200) rotate(0)" fill="none" stroke="#2F3FE0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M-6,-8 L5,0 L-6,8" transform="translate(1100,280) rotate(90)" fill="none" stroke="#2F3FE0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M-6,-8 L5,0 L-6,8" transform="translate(790,360) rotate(180)" fill="none" stroke="#2F3FE0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M-6,-8 L5,0 L-6,8" transform="translate(410,360) rotate(180)" fill="none" stroke="#2F3FE0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M-6,-8 L5,0 L-6,8" transform="translate(100,280) rotate(270)" fill="none" stroke="#2F3FE0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle r="8" fill="#F0A81F" stroke="#fff" stroke-width="2"><animateMotion dur="18s" repeatCount="indefinite"><mpath href="#trk"/></animateMotion></circle>
<circle cx="220" cy="200" r="15" fill="#fff" stroke="#2F3FE0" stroke-width="5"/>
<text x="220" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14183A" text-anchor="middle" >Test calls</text>
<text x="220" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5A6080" text-anchor="middle" >~15,000 per quarter, pre-release</text>
<circle cx="600" cy="200" r="15" fill="#fff" stroke="#2F3FE0" stroke-width="5"/>
<text x="600" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14183A" text-anchor="middle" >Live calls</text>
<text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5A6080" text-anchor="middle" >35,000+ a month</text>
<circle cx="980" cy="200" r="15" fill="#fff" stroke="#2F3FE0" stroke-width="5"/>
<text x="980" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14183A" text-anchor="middle" >LLM judge</text>
<text x="980" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5A6080" text-anchor="middle" >~90% F1 on issue detection</text>
<circle cx="980" cy="360" r="15" fill="#fff" stroke="#2F3FE0" stroke-width="5"/>
<text x="980" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14183A" text-anchor="middle" >Human review</text>
<text x="980" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5A6080" text-anchor="middle" >QA confirms flagged calls</text>
<circle cx="600" cy="360" r="15" fill="#fff" stroke="#2F3FE0" stroke-width="5"/>
<text x="600" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14183A" text-anchor="middle" >Ticket</text>
<text x="600" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5A6080" text-anchor="middle" >opened in DevOps automatically</text>
<circle cx="220" cy="360" r="15" fill="#fff" stroke="#2F3FE0" stroke-width="5"/>
<text x="220" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14183A" text-anchor="middle" >Fix and re-test</text>
<text x="220" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5A6080" text-anchor="middle" >back into the test calls</text>
<text x="600" y="274" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="23" font-weight="400" fill="#14183A" text-anchor="middle" font-style="italic">Replaces manual listening with scoring on every call,</text>
<text x="600" y="306" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="23" font-weight="400" fill="#14183A" text-anchor="middle" font-style="italic">and sends people only the calls that need a human.</text>
</svg>
