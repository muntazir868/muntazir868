<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#14183A"/></marker></defs>
<title id="t">Timeline of one conversational turn</title><desc id="d">Swim-lane timeline showing the caller speaking, speech-to-text, the LLM calling a clinical system, text-to-speech, and the reply reaching the caller, with time to first token and time to first audio marked. Illustrative, not measured.</desc>
<rect x="0.5" y="0.5" width="1199" height="569" rx="20" fill="#F5F6FA" stroke="#D3D7E6"/>
<text x="40" y="58" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="32" font-weight="700" fill="#14183A" text-anchor="start" >One conversational turn</text>
<text x="40" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5A6080" text-anchor="start" >Where the time goes between a caller finishing a sentence and hearing the reply. Shapes are illustrative.</text>
<rect x="40" y="118" width="1120" height="54" fill="#E9ECF7"/>
<text x="60" y="150.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14183A" text-anchor="start" >Caller</text>
<text x="60" y="204.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14183A" text-anchor="start" >LiveKit</text>
<rect x="40" y="226" width="1120" height="54" fill="#E9ECF7"/>
<text x="60" y="258.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14183A" text-anchor="start" >Speech to text</text>
<text x="60" y="312.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14183A" text-anchor="start" >LLM agent</text>
<rect x="40" y="334" width="1120" height="54" fill="#E9ECF7"/>
<text x="60" y="366.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14183A" text-anchor="start" >Clinical system</text>
<text x="60" y="420.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14183A" text-anchor="start" >Text to speech</text>
<line x1="450" y1="118" x2="450" y2="520" stroke="#F0A81F" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="745" y1="118" x2="745" y2="472" stroke="#F0A81F" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="845" y1="118" x2="845" y2="520" stroke="#F0A81F" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="250" y="132" width="200" height="26" rx="8" fill="#98A0BF"/>
<text x="350.0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle" >speaks</text>
<rect x="845" y="132" width="305" height="26" rx="8" fill="#2F3FE0"/>
<text x="997.5" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle" >hears the reply</text>
<rect x="250" y="186" width="200" height="26" rx="8" fill="#B4BBF6"/>
<text x="350.0" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14183A" text-anchor="middle" >audio in</text>
<rect x="835" y="186" width="315" height="26" rx="8" fill="#B4BBF6"/>
<text x="992.5" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14183A" text-anchor="middle" >audio out</text>
<rect x="270" y="240" width="270" height="26" rx="8" fill="#B4BBF6"/>
<text x="405.0" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14183A" text-anchor="middle" >transcribes as they speak</text>
<rect x="540" y="294" width="85" height="26" rx="8" fill="#2F3FE0"/>
<text x="582.5" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle" >reads</text>
<rect x="625" y="294" width="120" height="26" rx="8" fill="#F0A81F"/>
<text x="685.0" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14183A" text-anchor="middle" >tool call</text>
<rect x="745" y="294" width="335" height="26" rx="8" fill="#2F3FE0"/>
<text x="912.5" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle" >streams the reply</text>
<rect x="625" y="348" width="120" height="26" rx="8" fill="#F0A81F"/>
<text x="685.0" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14183A" text-anchor="middle" >booking lookup</text>
<rect x="795" y="402" width="345" height="26" rx="8" fill="#2F3FE0"/>
<text x="967.5" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle" >speaks it sentence by sentence</text>
<path d="M450 191 l8 8 l-8 8 l-8 -8 Z" fill="#14183A"/>
<text x="466" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#14183A" text-anchor="start" >end of turn</text>
<line x1="450" y1="472" x2="745" y2="472" stroke="#14183A" stroke-width="2.5" marker-start="url(#aI)" marker-end="url(#aI)"/>
<text x="597.5" y="463" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14183A" text-anchor="middle" >time to first token</text>
<line x1="450" y1="520" x2="845" y2="520" stroke="#14183A" stroke-width="2.5" marker-start="url(#aI)" marker-end="url(#aI)"/>
<text x="647.5" y="511" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14183A" text-anchor="middle" >time to first audio</text>
<text x="1130" y="463" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6080" text-anchor="end" font-style="italic">The reply starts playing while</text>
<text x="1130" y="481" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6080" text-anchor="end" font-style="italic">the model is still writing it.</text>
</svg>
